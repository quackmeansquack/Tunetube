<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#16111c">
<title>Tunetube</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600&display=swap">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
/* Layout: sidebar + scrolling main + fixed transport bar; phones swap sidebar for a bottom tab row */
:root{
  --ink:#16111c; --panel:#1f1828; --raise:#2a2135; --line:#3a2f47;
  --fg:#f3ecf7; --dim:#a898b6; --gold:#f2b84b; --gold-ink:#2a1a00; --skip:#7fd1b9; --warn:#f08a7a;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Figtree", system-ui, -apple-system, sans-serif;
  --bar:84px; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--ink);color:var(--fg);font:15px/1.45 var(--body);overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:disabled{opacity:.5;cursor:default}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
input,textarea,select{font:inherit}
a{color:var(--gold)}
.app{display:grid;grid-template-columns:240px 1fr;grid-template-rows:1fr var(--bar);height:100%}
aside{grid-row:1;background:var(--panel);padding:20px 14px;display:flex;flex-direction:column;gap:6px;border-right:1px solid var(--line);min-height:0}
.brand{font:800 26px/1 var(--display);letter-spacing:-.02em;padding:4px 10px 18px;display:flex;align-items:center;gap:8px}
.brand i{width:12px;height:12px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 4px rgba(242,184,75,.18)}
.nav{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:var(--dim);font-weight:600;text-align:left}
.nav[aria-current="true"]{background:var(--raise);color:var(--fg)}
.nav svg{width:20px;height:20px;flex:none}
.side-pl{margin-top:14px;border-top:1px solid var(--line);padding-top:12px;overflow:auto;display:flex;flex-direction:column;gap:2px;min-height:0}
.side-pl button{text-align:left;padding:7px 12px;border-radius:8px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:none}
.side-pl button:hover{color:var(--fg);background:var(--raise)}
.label{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--dim);padding:8px 12px 6px}
main{overflow:auto;padding-block:28px 40px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));min-width:0}
h1{font:800 clamp(28px,5vw,44px)/1.05 var(--display);letter-spacing:-.025em;margin:0 0 6px;text-wrap:balance}
h2{font:700 20px/1.2 var(--display);margin:30px 0 12px;text-wrap:balance}
h3{font:700 16px/1.3 var(--display);margin:0}
.sub{color:var(--dim);margin:0 0 20px;max-width:62ch}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{background:var(--gold);color:var(--gold-ink);font-weight:700;padding:10px 18px;border-radius:999px;display:inline-flex;align-items:center;gap:6px}
.btn.ghost{background:var(--raise);color:var(--fg)}
.btn.small{padding:7px 14px;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:16px}
.card{background:var(--panel);border-radius:12px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:8px;min-width:0}
.card:hover{background:var(--raise)}
.card img,.card .ph{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;background:var(--raise)}
.card .ph{display:grid;place-items:center;font:800 40px var(--display);color:var(--gold);background:linear-gradient(135deg,var(--raise),var(--line))}
.card b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card span{color:var(--dim);font-size:13px}
.tracks{display:flex;flex-direction:column}
.track{display:grid;grid-template-columns:28px 48px minmax(0,1fr) auto;gap:12px;align-items:center;padding:8px 10px;border-radius:8px;text-align:left;width:100%;cursor:pointer}
.track:hover{background:var(--panel)}
.track.on{background:var(--raise)}
.track.on .t{color:var(--gold)}
.track .n{color:var(--dim);font-variant-numeric:tabular-nums;text-align:right}
.track img,.track .noart{width:48px;height:48px;object-fit:cover;border-radius:6px;background:var(--raise)}
.track .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track .a{color:var(--dim);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{font-size:11px;letter-spacing:.04em;border-radius:999px;padding:1px 7px;margin-left:6px;border:1px solid var(--line);color:var(--dim);vertical-align:1px}
.tag.bad{border-color:var(--warn);color:var(--warn)}
.acts{display:flex;gap:2px}
.acts button{color:var(--dim);padding:6px;border-radius:6px;display:grid;place-items:center}
.acts button:hover{color:var(--fg);background:var(--line)}
.search{display:flex;gap:8px;max-width:560px}
.search input{flex:1;min-width:0;background:var(--fg);color:var(--ink);border:0;border-radius:999px;padding:12px 18px}
.empty{background:var(--panel);border:1px dashed var(--line);border-radius:12px;padding:20px;color:var(--dim);max-width:62ch}
.box{background:var(--panel);border-radius:14px;padding:20px;max-width:680px;display:flex;flex-direction:column;gap:12px}
.box ol{margin:0;padding-left:20px;color:var(--dim);display:flex;flex-direction:column;gap:6px}
.box p{margin:0;color:var(--dim)}
code{background:var(--raise);padding:1px 6px;border-radius:5px;color:var(--fg);font-size:13px;word-break:break-all}
.field{background:var(--ink);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%}
textarea.field{min-height:160px;resize:vertical;font-size:14px}
.toggle{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:12px 0;border-bottom:1px solid var(--line)}
.toggle small{display:block;color:var(--dim)}
.toggle input{width:20px;height:20px;accent-color:var(--gold);flex:none}
.meter{height:8px;border-radius:4px;background:var(--line);overflow:hidden;max-width:680px}
.meter i{display:block;height:100%;background:var(--skip);border-radius:4px;transition:width .3s}
.stat{color:var(--dim);font-size:14px;font-variant-numeric:tabular-nums}
.stat b{color:var(--fg)}
/* transport */
.bar{grid-column:1/-1;background:var(--panel);border-top:1px solid var(--line);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr) minmax(0,1fr);align-items:center;gap:16px;padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.np{display:flex;gap:12px;align-items:center;min-width:0;text-align:left}
.np img{width:54px;height:54px;border-radius:6px;object-fit:cover;background:var(--raise);flex:none}
.np div{min-width:0}
.np b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np span{color:var(--dim);font-size:13px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctl{display:flex;flex-direction:column;gap:6px;align-items:center}
.ctl .row{gap:14px;justify-content:center;flex-wrap:nowrap}
.ic{width:36px;height:36px;display:grid;place-items:center;border-radius:50%;color:var(--dim)}
.ic:hover{color:var(--fg)}
.ic.on{color:var(--gold)}
.ic svg{width:20px;height:20px}
.play{width:42px;height:42px;background:var(--fg);color:var(--ink);border-radius:50%;display:grid;place-items:center}
.play svg{width:20px;height:20px}
.prog{display:flex;align-items:center;gap:10px;width:100%;font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}
.track-bar{position:relative;flex:1;height:6px;background:var(--line);border-radius:3px;cursor:pointer}
.track-bar .fill{position:absolute;inset:0 auto 0 0;background:var(--fg);border-radius:3px}
.track-bar .seg{position:absolute;top:0;bottom:0;background:var(--skip);opacity:.75;border-radius:2px}
.track-bar .seg.mine{background:var(--gold)}
.right{display:flex;justify-content:flex-end;align-items:center;gap:10px}
.pill{font-size:12px;color:var(--skip);border:1px solid var(--skip);border-radius:999px;padding:3px 10px;white-space:nowrap}
.vol{width:96px;accent-color:var(--fg)}
/* now playing sheet */
.sheet{position:fixed;inset:0 0 var(--bar) 0;background:linear-gradient(180deg,#2c1f3a 0%,var(--ink) 70%);z-index:5;overflow:auto;padding-block:max(20px,env(safe-area-inset-top,0px)) 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet-in{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.sheet-top{display:flex;justify-content:space-between;align-items:center}
.stage{width:100%;aspect-ratio:16/9;max-width:100%;border-radius:14px;overflow:hidden;background:#000}
.sheet h1{font-size:clamp(24px,5vw,34px)}
.log{font-size:13px;color:var(--dim);display:flex;flex-direction:column;gap:4px}
.log b{color:var(--skip);font-weight:600}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.tools select{background:var(--raise);color:var(--fg);border:0;border-radius:999px;padding:8px 14px;font-weight:600}
#parking{position:fixed;width:200px;height:200px;right:12px;bottom:calc(var(--bar) + 12px);opacity:.001;pointer-events:none;z-index:-1}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--bar) + 16px);background:var(--skip);color:#06231b;font-weight:600;padding:8px 16px;border-radius:999px;z-index:20;font-size:13px;max-width:calc(100% - 32px);text-align:center}
/* picker */
.scrim{position:fixed;inset:0;background:rgba(10,6,14,.72);z-index:15;display:grid;place-items:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-bottom,0px))}
.picker{background:var(--panel);border-radius:16px;padding:18px;width:100%;max-width:520px;max-height:100%;overflow:auto;display:flex;flex-direction:column;gap:10px}
.cand{display:grid;grid-template-columns:72px minmax(0,1fr) auto;gap:12px;align-items:center;text-align:left;padding:8px;border-radius:10px;width:100%}
.cand:hover{background:var(--raise)}
.cand.on{outline:2px solid var(--gold)}
.cand img{width:72px;aspect-ratio:16/9;object-fit:cover;border-radius:6px;background:var(--raise)}
.cand b{display:block;font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.cand span{color:var(--dim);font-size:12px}
.mobnav{display:none}
@media (max-width:760px){
  :root{--bar:132px}
  .app{grid-template-columns:1fr}
  aside{display:none}
  main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 24px}
  .bar{grid-template-columns:minmax(0,1fr) auto;grid-template-rows:auto auto auto;gap:6px 10px;padding-block:8px calc(4px + env(safe-area-inset-bottom,0px));align-content:start}
  .np{grid-column:1;grid-row:1}
  .np img{width:42px;height:42px}
  .ctl{display:contents}
  .ctl .row{grid-column:2;grid-row:1;gap:4px}
  .ctl .row .hide-m{display:none}
  .prog{grid-column:1/-1;grid-row:2}
  .right{display:none}
  .mobnav{display:flex;grid-column:1/-1;grid-row:3;justify-content:space-around;border-top:1px solid var(--line);padding-top:4px}
  .mobnav .nav{flex-direction:column;gap:2px;font-size:11px;padding:4px 6px}
  .track{grid-template-columns:44px minmax(0,1fr) auto;gap:10px;padding:8px 4px}
  .track .n{display:none}
  .track img,.track .noart{width:44px;height:44px}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand"><i></i>Tunetube</div>
    <button class="nav" data-view="home"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3 2 11h3v9h5v-6h4v6h5v-9h3z"/></svg>Home</button>
    <button class="nav" data-view="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>Search</button>
    <button class="nav" data-view="library"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 3h3v18H4zm5 0h3v18H9zm5.2.6 2.9-.8 4.7 17.4-2.9.8z"/></svg>Library</button>
    <button class="nav" data-view="import"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 3v12m0 0-5-5m5 5 5-5M4 19h16"/></svg>Import</button>
    <button class="nav" data-view="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="9"/></svg>Settings</button>
    <div class="side-pl" id="sidePl"></div>
  </aside>

  <main id="main"></main>

  <footer class="bar">
    <button class="np" id="npBtn" aria-label="Open now playing">
      <img id="npArt" alt="">
      <div><b id="npTitle">Nothing playing</b><span id="npArtist">Pick a song to start</span></div>
    </button>
    <div class="ctl">
      <div class="row">
        <button class="ic hide-m" id="shuf" aria-label="Shuffle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg></button>
        <button class="ic" id="prev" aria-label="Previous"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h2v14H6zm3.5 7L19 5v14z"/></svg></button>
        <button class="play" id="playBtn" aria-label="Play"><svg viewBox="0 0 24 24" fill="currentColor" id="playIc"><path d="M7 4v16l13-8z"/></svg></button>
        <button class="ic" id="next" aria-label="Next"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 5h2v14h-2zM5 5l9.5 7L5 19z"/></svg></button>
        <button class="ic hide-m" id="rep" aria-label="Repeat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 2l4 4-4 4"/><path d="M3 11V9a3 3 0 0 1 3-3h15M7 22l-4-4 4-4"/><path d="M21 13v2a3 3 0 0 1-3 3H3"/></svg></button>
      </div>
      <div class="prog"><span id="tCur">0:00</span><div class="track-bar" id="seek"><div class="fill" id="fill" style="width:0"></div></div><span id="tDur">0:00</span></div>
    </div>
    <div class="right">
      <span class="pill" id="skipPill" hidden></span>
      <input type="range" class="vol" id="vol" min="0" max="100" value="80" aria-label="Volume">
    </div>
    <nav class="mobnav">
      <button class="nav" data-view="home"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3 2 11h3v9h5v-6h4v6h5v-9h3z"/></svg>Home</button>
      <button class="nav" data-view="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>Search</button>
      <button class="nav" data-view="library"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 3h3v18H4zm5 0h3v18H9zm5.2.6 2.9-.8 4.7 17.4-2.9.8z"/></svg>Library</button>
      <button class="nav" data-view="import"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 3v12m0 0-5-5m5 5 5-5M4 19h16"/></svg>Import</button>
      <button class="nav" data-view="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="9"/></svg>Settings</button>
    </nav>
  </footer>
</div>

<section class="sheet" id="sheet" hidden>
  <div class="sheet-in">
    <div class="sheet-top"><span class="label" style="padding:0">Now playing</span><button class="btn ghost small" id="closeSheet">Close</button></div>
    <div class="stage" id="stage"></div>
    <div><h1 id="shTitle">—</h1><p class="sub" id="shArtist" style="margin:0"></p></div>
    <div class="tools">
      <button class="btn ghost small" id="markBtn">Mark skip start</button>
      <button class="btn ghost small" id="clearMarks" hidden>Clear my marks</button>
      <select id="sleep" aria-label="Sleep timer">
        <option value="">Sleep timer off</option>
        <option value="15">Stop in 15 min</option>
        <option value="30">Stop in 30 min</option>
        <option value="60">Stop in 1 hour</option>
        <option value="end">Stop after this song</option>
      </select>
    </div>
    <div class="log" id="shLog"></div>
    <h2 style="margin:6px 0 0">Up next</h2>
    <div class="tracks" id="shQueue"></div>
  </div>
</section>
<div class="scrim" id="scrim" hidden><div class="picker" id="picker"></div></div>
<div id="parking"><div id="yt"></div></div>
<div class="toast" id="toast" hidden></div>
<input type="file" id="restoreFile" accept="application/json,.json" hidden>

<script>
/* ======================= storage ======================= */
const store = {
  get(k, d){ try{ const v = localStorage.getItem('tt.'+k); return v==null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem('tt.'+k, JSON.stringify(v)); }catch(e){ toast('Browser storage is full or blocked'); } }
};
const BACKUP_KEYS = ['clientId','spClientId','prefs','recent','local','match','mySkips','plays'];
const S = {
  clientId: store.get('clientId',''), spClientId: store.get('spClientId',''),
  token:null, tokenExp:0, wtoken:null, wtokenExp:0,
  sp: store.get('sp', null),
  view:'home', viewArg:null,
  playlists:[], liked:[], spLists:null,
  queue:[], idx:-1, shuffle:false, repeat:false,
  segments:[], skipLog:[], markStart:null, sleep:null,
  prefs: Object.assign({ offtopic:true, intro:false, outro:false, sponsor:true, selfpromo:true, preview:false, musicOnly:true, cleanTitles:true, preferAudio:true }, store.get('prefs',{})),
  recent: store.get('recent', []),
  local: store.get('local', []),
  match: store.get('match', {}),
  mySkips: store.get('mySkips', {}),
  plays: store.get('plays', {}),
  job: null
};
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const decTA = document.createElement('textarea');
const dec = s => { decTA.innerHTML = s || ''; return decTA.value; };
const fmt = s => { s = Math.max(0, Math.floor(s||0)); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); };
const uid = () => Math.random().toString(36).slice(2,10);
const sleepMs = ms => new Promise(r => setTimeout(r, ms));

/* ======================= titles ======================= */
const JUNK = /\s*[\(\[\{][^\)\]\}]*(official|music video|lyric|lyrics|visuali[sz]er|audio|video|hd|hq|4k|remaster(ed)?|explicit|mv|m\/v)[^\)\]\}]*[\)\]\}]/gi;
function cleanTitle(t){ return S.prefs.cleanTitles ? t.replace(JUNK,'').replace(/\s*\|\s*.*$/,'').replace(/\s{2,}/g,' ').trim() : t; }
function cleanArtist(a){ return (a||'').replace(/\s*-\s*Topic$/i,'').replace(/VEVO$/i,'').trim(); }
function splitArtist(title, channel){
  const t = cleanTitle(title); const m = t.match(/^(.+?)\s+[-–—]\s+(.+)$/);
  return m ? { title:m[2], artist:m[1] } : { title:t, artist:cleanArtist(channel) };
}
function thumbOf(sn, id){ const th = sn.thumbnails || {}; return (th.high||th.medium||th.default||{}).url || `https://i.ytimg.com/vi/${id}/hqdefault.jpg`; }
function toTrack(id, sn){
  const raw = dec(sn.title||''); const p = splitArtist(raw, dec(sn.videoOwnerChannelTitle || sn.channelTitle));
  return { id, title:p.title, artist:p.artist, art:thumbOf(sn,id) };
}
function norm(s){
  return (s||'').toLowerCase().normalize('NFKD').replace(/[̀-ͯ]/g,'')
    .replace(/\(.*?\)|\[.*?\]/g,' ').replace(/\b(feat|ft|featuring)\b\.?.*$/,' ')
    .replace(/&/g,' and ').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
}
const mkey = (artist, title) => norm(artist)+'|'+norm(title);

/* ======================= Google sign-in ======================= */
const READ_SCOPE = 'https://www.googleapis.com/auth/youtube.readonly';
const WRITE_SCOPE = 'https://www.googleapis.com/auth/youtube';
let tokenClient = null, writeClient = null, waitRead = [], waitWrite = [];
function initAuth(){
  if(!S.clientId || !window.google?.accounts?.oauth2) return false;
  tokenClient = google.accounts.oauth2.initTokenClient({ client_id:S.clientId, scope:READ_SCOPE, callback:r => {
    if(r.error){ toast('Sign-in failed: '+r.error); waitRead.splice(0).forEach(f=>f(null)); return; }
    S.token = r.access_token; S.tokenExp = Date.now() + (r.expires_in-60)*1000;
    waitRead.splice(0).forEach(f=>f(S.token)); loadLibrary();
  }});
  writeClient = google.accounts.oauth2.initTokenClient({ client_id:S.clientId, scope:WRITE_SCOPE, callback:r => {
    if(r.error){ toast('Permission not given: '+r.error); waitWrite.splice(0).forEach(f=>f(null)); return; }

function signIn(){

}
function writeToken(){
  if(S.wtoken && Date.now() < S.wtokenExp) return Promise.resolve(S.wtoken);

async function yt(path, params, opts = {}){

  if(!tok) throw new Error('signin');

  Object.entries(params||{}).forEach(([k,v]) => u.searchParams.set(k, v));
  const r = await fetch(u, { method:opts.method||'GET', headers:{ Authorization:'Bearer '+tok, ...(opts.body?{'Content-Type':'application/json'}:{}) }, body: opts.body ? JSON.stringify(opts.body) : undefined });

/* ======================= Spotify → YouTube matching ======================= */
const ALT = /\b(live|cover|karaoke|instrumental|remix|sped ?up|slowed|reverb|8d|nightcore|reaction|tutorial|lesson|acoustic|piano version|lyrics? (?:español|traducida))\b/i;
const isoSec = d => { const m = /PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/.exec(d||''); return m ? (+m[1]||0)*3600 + (+m[2]||0)*60 + (+m[3]||0) : 0; };
function scoreCand(t, c, rank){
  const nt = norm(t.title), na = norm(t.artist), vt = norm(c.title), ch = norm(c.channel);
  let s = 0;
  if(nt && vt.includes(nt)) s += 4;
  else { const w = nt.split(' ').filter(Boolean); const hit = w.filter(x => vt.includes(x)).length; s += w.length ? 3*hit/w.length : 0; }
  if(na && (vt.includes(na) || ch.includes(na) || na.includes(ch.replace(/ topic$/,'')))) s += 3;
  if(/ - topic$/i.test(c.channel)) s += S.prefs.preferAudio ? 4 : 1;
  else if(/vevo$/i.test(c.channel)) s += 1;
  if(!ALT.test(t.title) && ALT.test(c.title)) s -= 5;
  if(t.durMs && c.dur){ const d = Math.abs(c.dur - t.durMs/1000); s += d < 4 ? 3 : d < 12 ? 1.5 : d < 40 ? 0 : -2 - Math.min(3, d/60); }
  return s - rank*0.3;
}
async function findMatch(t){
  const k = mkey(t.artist, t.title);
  if(S.match[k]) return S.match[k];
  const r = await yt('search', { part:'snippet', type:'video', maxResults:8, q:`${t.artist} ${t.title}`.trim() });
  const items = (r.items||[]).filter(i => i.id?.videoId);
  let res = { id:'', cands:[] };
  if(items.length){
    let durs = {};
    try{ const d = await yt('videos', { part:'contentDetails', id:items.map(i=>i.id.videoId).join(',') }); (d.items||[]).forEach(v => durs[v.id] = isoSec(v.contentDetails.duration)); }catch(e){ if(e.message==='quota') throw e; }
    const cands = items.map((i,rank) => { const c = { id:i.id.videoId, title:dec(i.snippet.title), channel:dec(i.snippet.channelTitle), art:thumbOf(i.snippet,i.id.videoId), dur:durs[i.id.videoId]||0 }; c.score = scoreCand(t, c, rank); return c; })
                       .sort((a,b) => b.score - a.score);
    res = { id: cands[0].score > 2 ? cands[0].id : '', cands: cands.slice(0,6).map(({score,...c}) => c) };
  }
  S.match[k] = res; store.set('match', S.match);
  return res;
}
function localById(id){ return S.local.find(p => p.id === id); }
function saveLocal(){ store.set('local', S.local); }
function applyMatch(lt, m){
  lt.yt = m.id || ''; const c = m.cands.find(x => x.id === m.id); if(c) lt.ytArt = c.art;
}
async function runMatching(plId){
  const pl = localById(plId); if(!pl) return;
  if(!S.token){ toast('Sign in to YouTube first'); return; }
  if(S.job){ S.job.stop = true; await sleepMs(50); }
  const job = S.job = { plId, stop:false };
  updateJobUI();
  for(const lt of pl.tracks){
    if(job.stop) break;
    if(lt.yt !== undefined) continue;
    try{ applyMatch(lt, await findMatch(lt)); saveLocal(); updateJobUI(); }
    catch(e){ toast(errMsg(e)); break; }
  }
  if(S.job === job) S.job = null;
  updateJobUI();
  if(S.view === 'lpl' && S.viewArg === plId) render();
}
function counts(pl){
  let ok=0, none=0, todo=0; pl.tracks.forEach(t => t.yt === undefined ? todo++ : t.yt ? ok++ : none++);
  return { ok, none, todo, all:pl.tracks.length };
}
function updateJobUI(){
  const el = $('jobUI'); if(!el) return;
  const pl = localById(S.viewArg); if(!pl) return;
  const c = counts(pl); const done = c.all - c.todo;
  const running = S.job && S.job.plId === pl.id;
  el.innerHTML = `<div class="meter"><i style="width:${c.all? done/c.all*100 : 0}%"></i></div>
    <div class="stat"><b>${c.ok}</b> matched · <b>${c.none}</b> not found · <b>${c.todo}</b> to go${running?' · matching now…':''}</div>
    <div class="row">
      ${c.todo ? (running ? `<button class="btn ghost small" data-stopjob>Pause matching</button>` : `<button class="btn small" data-match="${pl.id}">${done?'Resume':'Match'} ${c.todo} song${c.todo>1?'s':''}</button>`) : ''}
      ${c.ok ? `<button class="btn ghost small" data-saveyt="${pl.id}">${pl.ytId ? 'Update YouTube playlist' : 'Save to my YouTube'}</button>` : ''}
      <button class="btn ghost small" data-delpl="${pl.id}">Delete</button>
    </div>
    ${c.todo > 90 ? `<p class="sub" style="margin:0">YouTube allows about 95 song lookups a day on a free key. Big playlists finish over a few days, and unmatched songs are looked up anyway when you play them.</p>` : ''}`;
}
async function saveToYouTube(plId){
  const pl = localById(plId); if(!pl) return;
  const tok = await writeToken(); if(!tok){ toast('Tunetube needs permission to create playlists on your account'); return; }
  try{
    if(!pl.ytId){
      const r = await yt('playlists', { part:'snippet,status' }, { method:'POST', token:tok, body:{ snippet:{ title:pl.name, description:'Imported with Tunetube' }, status:{ privacyStatus:'private' } } });
      pl.ytId = r.id; pl.ytSaved = []; saveLocal();

    loadLibrary();
  }catch(e){ toast(errMsg(e)); }
  updateJobUI();
}

/* ======================= import sources ======================= */
function parseCSV(text){
  const rows = []; let row = [], f = '', q = false;
  for(let i=0;i<text.length;i++){
    const c = text[i];
    if(q){ if(c === '"'){ if(text[i+1] === '"'){ f += '"'; i++; } else q = false; } else f += c; }
    else if(c === '"') q = true;
    else if(c === ','){ row.push(f); f = ''; }
    else if(c === '\n'){ row.push(f); rows.push(row); row = []; f = ''; }
    else if(c !== '\r') f += c;
  }
  if(f || row.length){ row.push(f); rows.push(row); }
  return rows.filter(r => r.some(x => x.trim()));
}
function tracksFromCSV(text){
  const rows = parseCSV(text.replace(/^﻿/,'')); if(rows.length < 2) return [];
  const h = rows[0].map(x => x.toLowerCase().trim());
  const find = (...tests) => { for(const t of tests){ const i = h.findIndex(x => t.test(x)); if(i >= 0) return i; } return -1; };
  const ti = find(/^track name$/, /^(track|title|song|song name|name)$/, /track name|title|song/);
  const ai = find(/^artist name\(s\)$/, /^artists?( name)?$/, /artist/);
  const di = find(/duration/);
  const li = find(/^album name$/, /^album$/);
  if(ti < 0) return [];
  return rows.slice(1).map(r => {
    const dur = di >= 0 ? +r[di] : 0;
    return { title:(r[ti]||'').trim(), artist:((ai>=0 ? r[ai] : '')||'').split(/[;,]/)[0].trim(), album: li>=0 ? r[li] : '', durMs: dur > 10000 ? dur : dur > 0 ? dur*1000 : 0 };
  }).filter(t => t.title);
}
function tracksFromText(text){
  return text.split(/\n/).map(l => l.replace(/^\s*\d+[\.\)]\s*/,'').trim()).filter(Boolean).map(l => {
    let m;
    if((m = l.split('\t')).length >= 2) return { title:m[0].trim(), artist:m[1].trim() };
    if((m = l.match(/^(.+?)\s+[-–—]\s+(.+)$/))) return { artist:m[1].trim(), title:m[2].trim() };
    if((m = l.match(/^(.+?)\s+by\s+(.+)$/i))) return { title:m[1].trim(), artist:m[2].trim() };
    return { title:l, artist:'' };
  }).filter(t => !/^https?:/.test(t.title));
}
function addLocal(name, tracks, source){
  const pl = { id:'l'+uid(), name:name || 'Imported playlist', source, created:Date.now(), tracks: tracks.map(t => {
    const m = S.match[mkey(t.artist, t.title)];
    const lt = { title:t.title, artist:t.artist, album:t.album||'', durMs:t.durMs||0, art:t.art||'' };
    if(m) applyMatch(lt, m);
    return lt;
  })};
  S.local.unshift(pl); saveLocal(); renderSide();
  S.view = 'lpl'; S.viewArg = pl.id; render();
  if(S.token) runMatching(pl.id);
  return pl;
}

/* ---------- Spotify account (optional, PKCE) ---------- */
const SP_REDIRECT = () => location.origin + location.pathname;
const b64url = buf => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
async function spConnect(){
  if(!S.spClientId){ toast('Paste your Spotify client ID first'); return; }
  if(!crypto?.subtle){ toast('Spotify sign-in needs the page on an https address'); return; }
  const v = b64url(crypto.getRandomValues(new Uint8Array(48)));
  const ch = b64url(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(v)));
  try{ sessionStorage.setItem('tt.spv', v); }catch(e){}
  const u = new URL('https://accounts.spotify.com/authorize');
  Object.entries({ response_type:'code', client_id:S.spClientId, scope:'playlist-read-private playlist-read-collaborative user-library-read', redirect_uri:SP_REDIRECT(), code_challenge_method:'S256', code_challenge:ch }).forEach(([k,x]) => u.searchParams.set(k,x));
  location.href = u.toString();
}
async function spHandleRedirect(){
  const p = new URLSearchParams(location.search);
  if(!p.has('code') && !p.has('error')) return;
  history.replaceState(null, '', location.pathname);
  if(p.has('error')){ toast('Spotify sign-in cancelled'); S.view = 'import'; return; }
  let v = null; try{ v = sessionStorage.getItem('tt.spv'); }catch(e){}
  if(!v) return;
  try{
    const r = await fetch('https://accounts.spotify.com/api/token', { method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'},
      body:new URLSearchParams({ grant_type:'authorization_code', code:p.get('code'), redirect_uri:SP_REDIRECT(), client_id:S.spClientId, code_verifier:v }) });
    const j = await r.json(); if(!r.ok) throw new Error(j.error_description || 'Spotify sign-in failed');
    S.sp = { token:j.access_token, exp:Date.now() + (j.expires_in-60)*1000 }; store.set('sp', S.sp);
    S.view = 'import';
  }catch(e){ toast(e.message); }
}
async function sp(path){
  if(!S.sp || Date.now() > S.sp.exp){ S.sp = null; store.set('sp', null); throw new Error('Spotify sign-in expired. Connect again.'); }
  const r = await fetch(path.startsWith('http') ? path : 'https://api.spotify.com/v1/'+path, { headers:{ Authorization:'Bearer '+S.sp.token } });
  if(r.status === 401){ S.sp = null; store.set('sp', null); throw new Error('Spotify sign-in expired. Connect again.'); }
  if(r.status === 403) throw new Error('Spotify blocked this. Its API only shares playlists you own or collaborate on, and the developer account needs Premium.');
  if(!r.ok) throw new Error('Spotify error '+r.status);
  return r.json();
}
async function spListPlaylists(){
  let out = [], url = 'me/playlists?limit=50';
  while(url && out.length < 300){ const j = await sp(url); out = out.concat(j.items||[]); url = j.next; }
  return out.filter(Boolean);
}
function spTrack(x){ const t = x?.item || x?.track; if(!t || t.type && t.type !== 'track' || t.is_local) return null;
  return { title:t.name, artist:t.artists?.[0]?.name || '', album:t.album?.name || '', durMs:t.duration_ms || 0, art:t.album?.images?.[1]?.url || t.album?.images?.[0]?.url || '' }; }
async function spImport(id, name){
  toast('Reading from Spotify…');
  try{
    let url = id === 'liked' ? 'me/tracks?limit=50' : `playlists/${id}/items?limit=50`, tracks = [];
    while(url && tracks.length < 2000){
      let j;
      try{ j = await sp(url); }catch(e){ if(id !== 'liked' && /error 404/.test(e.message) && url.includes('/items')){ url = url.replace('/items','/tracks'); continue; } throw e; }
      tracks = tracks.concat((j.items||[]).map(spTrack).filter(Boolean)); url = j.next;
    }
    if(!tracks.length) throw new Error('Spotify returned no songs. It only shares songs from playlists you own or collaborate on. Use the CSV option for others.');
    addLocal(name, tracks, 'Spotify');
  }catch(e){ toast(e.message); }
}

async function ensureId(t){
  if(t.id) return true;
  const lpl = t.lp && localById(t.lp); const lt = lpl && lpl.tracks[t.li];
  if(lt && lt.yt === '') return false;
  const m = await findMatch(t);
  if(lt){ applyMatch(lt, m); saveLocal(); }
  t.id = m.id; const c = m.cands.find(x => x.id === m.id); if(c) t.art = c.art;
  return !!t.id;
}
let playSeq = 0;
async function playAt(i, dir = 1){
  if(i < 0 || i >= S.queue.length) return;
  const seq = ++playSeq;
  S.idx = i; const t = S.queue[i];
  S.segments = []; S.skipLog = []; S.markStart = null; updateMarkBtn();
  updateNow();
  if(!t.id){
    try{ const ok = await ensureId(t); if(seq !== playSeq) return;
      if(!ok){ toast('No YouTube match for '+t.title+', skipping'); return dir < 0 ? playAt(i-1, -1) : next(true, true); }
    }catch(e){ toast(errMsg(e)); return; }
    updateNow();
  }
  loadingId = t.id;
  if(ready) player.loadVideoById(t.id);
  countPlay(t);
  const segs = await loadSegments(t.id);
  if(loadingId === t.id && seq === playSeq){ S.segments = segs; drawSegs(); updatePill(); }
  clearInterval(ticker); ticker = setInterval(tick, 250);
}
function countPlay(t){
  S.recent = [strip(t)].concat(S.recent.filter(r => r.id !== t.id)).slice(0, 24); store.set('recent', S.recent);
  const p = S.plays[t.id] || { n:0, t:strip(t) }; p.n++; p.t = strip(t); p.last = Date.now(); S.plays[t.id] = p; store.set('plays', S.plays);
}
const strip = t => ({ id:t.id, title:t.title, artist:t.artist, art:t.art });
function playList(list, i){ S.queue = list.map(x => ({...x})); if(S.shuffle) shuffleFrom(i); else playAt(i); }
function shuffleFrom(i){
  const first = S.queue[i]; const rest = S.queue.filter((_,k) => k !== i);
  for(let k=rest.length-1;k>0;k--){ const j = Math.floor(Math.random()*(k+1)); [rest[k],rest[j]] = [rest[j],rest[k]]; }
  S.queue = [first].concat(rest); playAt(0);
}
function next(auto, skipSleep){
  if(auto && !skipSleep && S.sleep === 'end'){ setSleep(''); setPlayIcon(false); toast('Sleep timer: stopped'); return; }
  if(auto && S.repeat && !skipSleep){ playAt(S.idx); return; }
  if(S.idx < S.queue.length-1) playAt(S.idx+1);
  else setPlayIcon(false);
}
function prev(){ if(ready && player.getCurrentTime() > 4) player.seekTo(firstStart(), true); else if(S.idx > 0) playAt(S.idx-1, -1); }
function firstStart(){ const s = S.segments[0]; return s && s.start < 1 ? s.end : 0; }
function checkSkip(){
  const c = player.getCurrentTime(), d = player.getDuration();
  for(const s of S.segments){
    if(c >= s.start - 0.05 && c < s.end - 0.3){
      S.skipLog.push(`Skipped ${CAT_NAME[s.cat]||s.cat} (${fmt(s.start)}–${fmt(s.end)})`);
      if(d && s.end >= d - 1.5){ toast('Skipped the ending, next song'); next(true); }
      else { player.seekTo(s.end, true); toast('Skipped '+(CAT_NAME[s.cat]||s.cat)); }
      renderLog(); return;
    }
  }
}
function tick(){
  if(!ready) return;
  if(typeof S.sleep === 'number' && Date.now() >= S.sleep){ player.pauseVideo(); setSleep(''); toast('Sleep timer: stopped'); }
  checkSkip();
  const c = player.getCurrentTime()||0, d = player.getDuration()||0;
  $('tCur').textContent = fmt(c); $('tDur').textContent = fmt(d);
  $('fill').style.width = d ? (c/d*100)+'%' : '0';
  if(S.markStart != null) $('markBtn').textContent = `Mark skip end (from ${fmt(S.markStart)})`;
}
function drawSegs(tries = 0){
  $('seek').querySelectorAll('.seg').forEach(n => n.remove());

}

function updateNow(){

      navigator.mediaSession.setActionHandler('nexttrack', () => next());
      navigator.mediaSession.setActionHandler('previoustrack', () => prev());
    }catch(e){}
  }
}
function renderLog(){
  const lines = []; const t = S.queue[S.idx];

    BACKUP_KEYS.forEach(k => { if(d[k] != null) store.set(k, d[k]); });
    S.clientId = store.get('clientId',''); S.spClientId = store.get('spClientId','');
    S.prefs = Object.assign(S.prefs, store.get('prefs',{})); S.recent = store.get('recent',[]); S.local = store.get('local',[]);
    S.match = store.get('match',{}); S.mySkips = store.get('mySkips',{}); S.plays = store.get('plays',{});
    tokenClient = writeClient = null; renderSide(); render(); toast('Backup restored');
  }catch(err){ toast('That file isn’t a Tunetube backup'); }
  e.target.value = '';
};

function renderSide(){
  const loc = S.local.map(p => `<button data-lpl="${p.id}">${esc(p.name)}</button>`).join('');
  const yt = S.playlists.map(p => `<button data-pl="${esc(p.id)}">${esc(dec(p.snippet.title))}</button>`).join('');
  $('sidePl').innerHTML = (loc ? '<div class="label">Imported</div>'+loc : '') + (yt ? '<div class="label">On YouTube</div>'+yt : '');
}

/* ---------- change-match picker ---------- */
async function openPicker(i){
  const pl = localById(S.viewArg); const lt = pl?.tracks[i]; if(!lt) return;
  const k = mkey(lt.artist, lt.title);
  $('scrim').hidden = false;
  $('picker').innerHTML = `<h3>${esc(lt.title)}</h3><p class="sub" style="margin:0">${esc(lt.artist)}</p><p class="sub" style="margin:0">Finding versions on YouTube…</p>`;
  let m = S.match[k];
  if(!m){ try{ m = await findMatch(lt); applyMatch(lt, m); saveLocal(); }catch(e){ $('picker').innerHTML += `<p class="sub">${esc(errMsg(e))}</p><button class="btn ghost" data-closepick>Close</button>`; return; } }
  $('picker').innerHTML = `<h3>${esc(lt.title)}</h3><p class="sub" style="margin:0">${esc(lt.artist)}${lt.durMs ? ' · '+fmt(lt.durMs/1000) : ''}</p>
    <div class="label" style="padding:6px 0 0">Pick the right version</div>
    ${m.cands.length ? m.cands.map(c => `<button class="cand${c.id===lt.yt?' on':''}" data-pick="${esc(c.id)}" data-pi="${i}"><img src="${esc(c.art)}" alt=""><div style="min-width:0"><b>${esc(c.title)}</b><span>${esc(c.channel)}</span></div><span>${c.dur ? fmt(c.dur) : ''}</span></button>`).join('') : '<p class="sub">YouTube found nothing for this song.</p>'}
    <div class="row" style="margin-top:6px"><button class="btn ghost small" data-rmtrack="${i}">Remove from playlist</button><button class="btn ghost small" data-closepick>Close</button></div>`;
}
function closePicker(){ $('scrim').hidden = true; }

/* ======================= events ======================= */
document.addEventListener('click', e => {
  const g = sel => e.target.closest(sel);
  let el;
  if((el = g('[data-view]'))){ S.view = el.dataset.view; S.viewArg = null; closeSheet(); closePicker(); render(); return; }
  if(g('[data-signin]')){ signIn(); return; }
  if((el = g('[data-pl]'))){ S.view = 'playlist'; S.viewArg = el.dataset.pl; closeSheet(); render(); return; }
  if((el = g('[data-lpl]'))){ S.view = 'lpl'; S.viewArg = el.dataset.lpl; closeSheet(); render(); return; }
  if((el = g('[data-match]'))){ runMatching(el.dataset.match); return; }
  if(g('[data-stopjob]')){ if(S.job) S.job.stop = true; return; }
  if((el = g('[data-saveyt]'))){ saveToYouTube(el.dataset.saveyt); return; }
  if((el = g('[data-delpl]'))){
    if(el.dataset.sure){ S.local = S.local.filter(p => p.id !== el.dataset.delpl); saveLocal(); renderSide(); S.view = 'library'; render(); toast('Playlist deleted from Tunetube'); }
    else { el.dataset.sure = '1'; el.textContent = 'Tap again to delete'; setTimeout(() => { if(el.isConnected){ delete el.dataset.sure; el.textContent = 'Delete'; } }, 3000); }
    return;
  }
  if((el = g('[data-spimp]'))){ spImport(el.dataset.spimp, el.dataset.name); return; }
  if((el = g('[data-playall]'))){ const l = sourceList(el.dataset.playall); if(l.length){ S.shuffle = false; $('shuf').classList.remove('on'); playList(l, 0); } return; }
  if((el = g('[data-shuffleall]'))){ const l = sourceList(el.dataset.shuffleall); if(l.length){ S.shuffle = true; $('shuf').classList.add('on'); playList(l, Math.floor(Math.random()*l.length)); } return; }
  if(g('[data-closepick]') || e.target === $('scrim')){ closePicker(); return; }
  if((el = g('[data-pick]'))){
    const pl = localById(S.viewArg); const lt = pl.tracks[+el.dataset.pi]; const k = mkey(lt.artist, lt.title);
    S.match[k] = { ...S.match[k], id:el.dataset.pick }; store.set('match', S.match);
    applyMatch(lt, S.match[k]); saveLocal(); closePicker(); render(); toast('Match updated'); return;
  }
  if((el = g('[data-rmtrack]'))){ const pl = localById(S.viewArg); pl.tracks.splice(+el.dataset.rmtrack, 1); saveLocal(); closePicker(); render(); return; }
  if((el = g('[data-fix]'))){ openPicker(+el.dataset.fix); return; }
  if((el = g('[data-q]'))){
    const row = el.closest('.track'); const t = sourceList(row.dataset.src)[+row.dataset.i];
    if(t){ if(S.idx < 0){ S.queue = [{...t}]; playAt(0); } else { S.queue.splice(S.idx+1, 0, {...t}); renderQueue(); toast('Plays next: '+t.title); } }
    return;
  }
  if((el = g('.track[data-src]'))){ const src = el.dataset.src, i = +el.dataset.i; if(src === 'queue') playAt(i); else playList(sourceList(src), i); }
});
document.addEventListener('keydown', e => {
  const typing = /INPUT|TEXTAREA|SELECT/.test(e.target.tagName);
  if(e.key === 'Enter' && e.target.matches?.('.track[role=button]')){ e.target.click(); return; }
  if(e.key === 'Escape'){ closePicker(); closeSheet(); return; }
  if(typing) return;
  if(e.key === ' ' && !e.target.closest('button')){ e.preventDefault(); togglePlay(); }
  if(e.key === 'ArrowRight' || e.key === 'ArrowLeft'){
    if(e.shiftKey) e.key === 'ArrowRight' ? next() : prev();
    else if(ready && S.idx >= 0) player.seekTo(Math.max(0, player.getCurrentTime() + (e.key === 'ArrowRight' ? 10 : -10)), true);
  }
});
$('playBtn').onclick = togglePlay;
$('next').onclick = () => next();
$('prev').onclick = prev;
$('shuf').onclick = () => { S.shuffle = !S.shuffle; $('shuf').classList.toggle('on', S.shuffle);
  if(S.shuffle && S.idx >= 0){ const rest = S.queue.slice(S.idx+1); for(let k=rest.length-1;k>0;k--){ const j = Math.floor(Math.random()*(k+1)); [rest[k],rest[j]] = [rest[j],rest[k]]; } S.queue = S.queue.slice(0, S.idx+1).concat(rest); renderQueue(); } };
$('rep').onclick = () => { S.repeat = !S.repeat; $('rep').classList.toggle('on', S.repeat); };
$('vol').oninput = e => ready && player.setVolume(+e.target.value);
$('seek').onclick = e => { if(!ready || S.idx < 0) return; const r = $('seek').getBoundingClientRect(); player.seekTo((e.clientX-r.left)/r.width*player.getDuration(), true); };
$('npBtn').onclick = () => { if(S.idx >= 0) openSheet(); };
$('closeSheet').onclick = closeSheet;
let toastT; function toast(msg){ const t = $('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, msg.length > 60 ? 5000 : 2400); }

window.addEventListener('load', () => { initAuth(); });
spHandleRedirect().then(render);
</script>
</body>
</html>
